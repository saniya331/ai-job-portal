<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Jobs - AI Job Portal</title>

    <link rel="stylesheet"
        href="../css/style.css">

</head>

<body>

    <div class="dashboard">

        <!-- NAVBAR -->

        <nav class="navbar">

            <div class="logo">
                AI Job Portal
            </div>

            <div>

                <button onclick="goDashboard()">
                    Dashboard
                </button>

                <button id="logoutBtn">
                    Logout
                </button>

            </div>

        </nav>


        <!-- MAIN -->

        <main class="dashboard-content">

            <div class="welcome-section">

                <h1>Available Jobs 💼</h1>

                <p>
                    Find jobs that match your skills.
                </p>

            </div>


            <!-- SEARCH -->

            <div class="job-search">

                <input
    type="text"
    id="searchInput"
    placeholder="Search jobs..."
    onkeyup="searchJobs()"
>

                <button onclick="searchJobs()">
                    Search
                </button>

            </div>


            <!-- MESSAGE -->

            <p id="message"></p>


            <!-- JOB LIST -->

            <div id="jobsContainer"
                class="jobs-container">

            </div>

        </main>

    </div>


    <script src="../js/api.js"></script>

    <script src="../js/jobs.js"></script>

</body>

</html>
