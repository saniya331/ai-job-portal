<!DOCTYPE html>
<html lang="en">


<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Post Job</title>


<link rel="stylesheet"
href="../css/style.css">


</head>


<body>


<div class="dashboard">


<nav class="navbar">


<div class="logo">
AI Job Portal
</div>


</nav>




<main class="dashboard-content">


<h1>
Post New Job 🚀
</h1>



<input id="title"
placeholder="Job Title">


<input id="company"
placeholder="Company Name">


<input id="location"
placeholder="Location">


<textarea id="description"
placeholder="Job Description">
</textarea>



<input id="requiredSkills"
placeholder="Required Skills">


<input id="salary"
placeholder="Salary">



<button onclick="postJob()">
Post Job
</button>



<p id="message"></p>



</main>


</div>



<script src="../js/recruiter.js"></script>


</body>

</html>
